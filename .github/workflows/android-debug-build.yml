name: Android - Build de prueba (APK)

# Se ejecuta manualmente desde la pestaña "Actions" de GitHub.
# Genera un APK de prueba, instalable directamente en un celular Android,
# sin necesidad de subirlo a Play Store. No requiere ninguna clave de firma.
on:
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm install

      - name: Compilar la aplicación web
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Sincronizar con el proyecto de Android
        run: npx cap sync android

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar el SDK de Android
        uses: android-actions/setup-android@v3

      - name: Dar permisos de ejecución a Gradle
        run: chmod +x android/gradlew

      - name: Compilar el APK de prueba
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Publicar el APK como resultado del build
        uses: actions/upload-artifact@v4
        with:
          name: verdad-o-reto-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
